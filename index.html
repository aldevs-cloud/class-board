function copyGradingCriteria(){
  const fromId = document.getElementById('mCopyGrFrom').value;
  const toId = document.getElementById('mCopyGrTo').value;
  if(fromId===toId){ toast('Please choose two different courses'); return; }
  const from = courseById(fromId), to = courseById(toId);
  if(!from || (!(from.gradingCourse||[]).length && !(from.gradingLab||[]).length)){ toast('The source course has no grading criteria to copy'); return; }
  if(!confirm(`Replace ${to.code}'s grading criteria with ${from.code}'s? Continue?`)) return;
  to.gradingCourse = (from.gradingCourse||[]).map(g=>({...g}));
  to.hasLab = !!from.hasLab;
  to.gradingLab = (from.gradingLab||[]).map(g=>({...g}));
  save(); closeModal(); toast('Grading criteria copied'); render();
}

/* ---------------- Attendance ---------------- */
function attendanceSessionsFor(courseId){
  return state.attendance.filter(a=>a.courseId===courseId).sort((a,b)=>a.date.localeCompare(b.date));
}
function ensureAttendanceDraft(courseId, date){
  const key = courseId+'|'+date;
  if(attendanceDraftKey===key) return;
  attendanceDraftKey = key;
  const students = state.students.filter(s=>s.courseId===courseId);
  const existing = state.attendance.find(a=>a.courseId===courseId && a.date===date);
  attendanceDraft = {};
  students.forEach(s=>{
    attendanceDraft[s.id] = (existing && existing.marks && existing.marks[s.id]) ? existing.marks[s.id] : 'P';
  });
}
function setAttendanceCourse(id){
  attendanceFilterCourse = id;
  attendanceSelectedDate = todayISO();
  attendanceDraftKey = '';
  attendanceWeekOffset = 0;
  render();
}
function isoLocal(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function weekStartDate(offsetWeeks){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-now.getDay()+offsetWeeks*7);
  return d;
}
function routineDaysForCourse(courseId){
  return [...new Set(state.routine.filter(r=>r.courseId===courseId).map(r=>r.day))].sort((a,b)=>a-b);
}
function shiftAttendanceWeek(delta){
  attendanceWeekOffset += delta;
  render();
}
function setAttendanceDate(d){
  attendanceSelectedDate = d;
  render();
}
function setDraftMark(studentId, mark){
  attendanceDraft[studentId] = mark;
  render();
}
function markAllPresent(){ Object.keys(attendanceDraft).forEach(k=>attendanceDraft[k]='P'); render(); }
function markAllAbsent(){ Object.keys(attendanceDraft).forEach(k=>attendanceDraft[k]='A'); render(); }
function saveAttendanceSession(){
  const course = courseById(attendanceFilterCourse);
  if(!course) return;
  if(!attendanceSelectedDate){ toast('Please choose a date'); return; }
  let existing = state.attendance.find(a=>a.courseId===course.id && a.date===attendanceSelectedDate);
  if(!existing){
    existing = {id:uid(), courseId:course.id, date:attendanceSelectedDate, marks:{}};
    state.attendance.push(existing);
  }
  existing.marks = {...attendanceDraft};
  save(); toast(`Attendance saved for ${fmtDate(attendanceSelectedDate)}`); render();
}
function editAttendanceSession(date){
  attendanceSelectedDate = date;
  attendanceDraftKey = '';
  render();
  window.scrollTo({top:0});
}
function deleteAttendanceSession(id){
  if(!confirm('Delete this attendance session? This cannot be undone.')) return;
  state.attendance = state.attendance.filter(a=>a.id!==id);
  attendanceDraftKey = '';
  save(); toast('Session deleted'); render();
}
function deleteAllAttendance(courseId){
  const c = courseById(courseId);
  if(!confirm(`Delete ALL attendance records for ${c?c.code:'this course'}? This cannot be undone.`)) return;
  state.attendance = state.attendance.filter(a=>a.courseId!==courseId);
  attendanceDraftKey = '';
  save(); toast('All attendance records deleted for this course'); render();
}
function attendanceBadgeClass(pct){
  if(pct>=75) return 'ok';
  if(pct>=60) return 'soon';
  return 'overdue';
}
function attendanceSummary(courseId){
  const sessions = attendanceSessionsFor(courseId);
  const students = state.students.filter(s=>s.courseId===courseId).sort((a,b)=>a.name.localeCompare(b.name));
  return students.map(s=>{
    let attended = 0;
    sessions.forEach(sess=>{ if(sess.marks && sess.marks[s.id]==='P') attended++; });
    const total = sessions.length;
    const pct = total>0? Math.round((attended/total)*1000)/10 : 0;
    return {student:s, attended, total, pct};
  });
}
function attendanceTableData(courseId){
  const c = courseById(courseId);
  const sessions = attendanceSessionsFor(courseId);
  const students = state.students.filter(s=>s.courseId===courseId).sort((a,b)=>a.name.localeCompare(b.name));
  const header = ['Name', ...sessions.map(s=>fmtDateShort(s.date)), 'Classes Held', 'Attended', 'Percentage'];
  const rows = students.map(s=>{
    let attended = 0;
    const marks = sessions.map(sess=>{
      const m = sess.marks ? sess.marks[s.id] : undefined;
      if(m==='P') attended++;
      return m==='P'? 'P' : (m==='A'? 'A' : '-');
    });
    const total = sessions.length;
    const pct = total>0? Math.round((attended/total)*1000)/10 : 0;
    return [s.name, ...marks, total, attended, pct+'%'];
  });
  return {course:c, header, rows, hasData: sessions.length>0 && students.length>0};
}
function exportAttendanceExcel(courseId){
  if(typeof XLSX==='undefined'){ toast('Excel export library did not load — check your connection'); return; }
  const {course:c, header, rows, hasData} = attendanceTableData(courseId);
  if(!hasData){ toast('Nothing to export yet for this course'); return; }
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = header.map(()=>({wch:13}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
  XLSX.writeFile(wb, `${safeFileName(c.code)}_attendance.xlsx`);

function isNetworkError(e){ const m = String((e&&e.message)||''); return !navigator.onLine || /failed to fetch|networkerror|load failed|network request failed|fetch/i.test(m); }
function friendlyDbError(e){
  const code = e && e.code, m = String((e&&e.message)||e||'');
  if(code==='42P01' || code==='PGRST205' || /does not exist|schema cache/i.test(m)) return 'The database table "'+CLOUD_TABLE+'" was not found. Run supabase_setup.sql in your Supabase SQL Editor, then reload this page.';
  if(code==='42501' || /row-level security|permission denied/i.test(m)) return 'The database refused access. Make sure the policies from supabase_setup.sql were created.';
  if(isNetworkError(e)) return 'Can\u2019t reach the server. Check your internet connection.';
  return m;
}
function friendlyAuthError(e){
  const m = String((e&&e.message)||e||'');
  if(/invalid login credentials/i.test(m)) return 'Incorrect email or password.';
  if(/rate limit|too many|security purposes/i.test(m)) return 'Too many attempts. Please wait a few minutes and try again.';
  if(/failed to fetch|networkerror|load failed/i.test(m)) return 'Can\u2019t reach the server. Check your internet connection.';
  if(/same password|different from the old/i.test(m)) return 'Please choose a password different from your current one.';
  if(/invalid api key|apikey/i.test(m)) return 'The Supabase key is not valid. Check SUPABASE_ANON_KEY.';
  return m;
}

/* ---- persistence hooks ---- */
function schedulePush(ms){ clearTimeout(cloud.timer); cloud.timer = setTimeout(()=>cloudPush(), ms); }

async function cloudPush(){
  if(!sb || !cloud.user || cloud.pushing || cloud.conflict || !cloud.dirty) return;
  if(!navigator.onLine){ setSync('offline'); return; }
  cloud.pushing = true; setSync('saving');
  const seq = cloud.seq;
  let again = false, conflict = false;
  try{
    const payload = JSON.parse(JSON.stringify(state));
    const r = await sb.from(CLOUD_TABLE).update({data:payload, rev:cloud.rev+1}).eq('user_id', cloud.user.id).eq('rev', cloud.rev).select('rev');
    if(r.error) throw r.error;
    if(!r.data || r.data.length===0){ conflict = true; }
    else{
      cloud.rev = r.data[0].rev;
      cloud.lastSync = new Date();
      if(cloud.seq===seq){ cloud.dirty = false; setSync('synced'); } else { again = true; }
      cacheWrite();
    }
  }catch(e){
    console.error('Cloud save failed', e);
    setSync(isNetworkError(e)?'offline':'error', e);
    schedulePush(15000);
  }
  cloud.pushing = false;
  if(conflict) await handleConflict();
  else if(again) schedulePush(300);
}

async function handleConflict(){
  cloud.conflict = true; setSync('conflict');
  let latest = null;
  try{
    const r = await sb.from(CLOUD_TABLE).select('data,rev').eq('user_id', cloud.user.id).maybeSingle();
    if(r.error) throw r.error;
    latest = r.data;
  }catch(e){ cloud.conflict = false; setSync('error', e); schedulePush(15000); return; }
  if(!latest){
    // the row disappeared (deleted manually) — recreate it from this device
    const ins = await sb.from(CLOUD_TABLE).insert({user_id:cloud.user.id, data:state, rev:1}).select('rev').single();
    cloud.conflict = false;
    if(ins.error){ setSync('error', ins.error); schedulePush(15000); return; }
    cloud.rev = ins.data.rev; cloud.dirty = false; cloud.lastSync = new Date(); cacheWrite(); setSync('synced'); return;
  }
  cloud.latest = latest;
  openLockedModal(`
    <h3>Newer data found</h3>
    <p style="font-size:13.5px; line-height:1.55; color:var(--chalk-dim); margin:0 0 6px;">
      Your account has newer data saved from another device or tab, and this device also has changes that aren\u2019t saved yet. Which version should be kept?
    </p>
    <div class="modal-actions" style="flex-direction:column; align-items:stretch;">
      <button class="btn btn-primary" onclick="conflictUseCloud()">Load the cloud version (discard changes on this device)</button>
      <button class="btn" onclick="conflictKeepLocal()">Keep this device\u2019s version (overwrite the cloud)</button>
      <button class="btn btn-ghost" onclick="exportJSON()">Download this device\u2019s data first</button>
    </div>
  `);
}
function conflictUseCloud(){
  const l = cloud.latest; if(!l) return;
  state = normalizeState(l.data); cloud.rev = l.rev; cloud.dirty = false; cloud.conflict = false; cloud.latest = null;
  cloud.lastSync = new Date(); cacheWrite(); closeModal(); setSync('synced'); render(); toast('Loaded the latest cloud data');
}
function conflictKeepLocal(){
  const l = cloud.latest; if(!l) return;
  cloud.rev = l.rev; cloud.conflict = false; cloud.latest = null; cloud.dirty = true;
  closeModal(); cloudPush();
}

/* returns 'updated' | 'same' | 'error' | 'skip' */
async function cloudPull(){
  if(!appReady || !cloud.user || cloud.dirty || cloud.pushing || cloud.conflict) return 'skip';
  if(!navigator.onLine){ setSync('offline'); return 'error'; }
  try{
    const head = await sb.from(CLOUD_TABLE).select('rev').eq('user_id', cloud.user.id).maybeSingle();
    if(head.error) throw head.error;
    if(!head.data || head.data.rev <= cloud.rev){ if(cloud.status==='offline'||cloud.status==='error') setSync('synced'); return 'same'; }
    const full = await sb.from(CLOUD_TABLE).select('data,rev').eq('user_id', cloud.user.id).maybeSingle();
    if(full.error) throw full.error;
    if(!full.data || cloud.dirty) return 'skip';
    state = normalizeState(full.data.data); cloud.rev = full.data.rev; cloud.lastSync = new Date();
    cacheWrite(); setSync('synced'); render();
    return 'updated';
  }catch(e){ console.error('Cloud refresh failed', e); setSync(isNetworkError(e)?'offline':'error', e); return 'error'; }
}
async function cloudSyncNow(){
  if(!cloud.user) return;
  if(cloud.conflict){ toast('Please resolve the conflict first'); return; }
  if(cloud.dirty){ clearTimeout(cloud.timer); await cloudPush(); toast(cloud.dirty ? 'Couldn\u2019t sync yet \u2014 will retry' : 'Everything is synced'); return; }
  const res = await cloudPull();
  toast(res==='updated' ? 'Loaded the latest data' : res==='error' ? 'Couldn\u2019t reach the server' : 'Already up to date');
}

async function cloudLoadInitial(){
  const uid = cloud.user.id;
  const cache = cacheRead(uid);
  let row = null, err = null;
  try{
    const r = await sb.from(CLOUD_TABLE).select('data,rev').eq('user_id', uid).maybeSingle();
    if(r.error) throw r.error;
    row = r.data;
  }catch(e){ err = e; }

  if(err){
    if(cache && isNetworkError(err)){            // offline start: use the last cached copy
      state = normalizeState(cache.state); cloud.rev = cache.rev || 0; cloud.dirty = !!cache.dirty;
      setSync('offline'); return;
    }
    throw err;
  }
  if(!row){                                       // brand-new account
    const legacy = localLegacyData();
    const initial = legacy || normalizeState({});
    const ins = await sb.from(CLOUD_TABLE).insert({user_id:uid, data:initial, rev:1}).select('rev').single();
    if(ins.error){
      if(ins.error.code==='23505') return cloudLoadInitial();   // another device created it a moment ago
      throw ins.error;
    }
    state = initial; cloud.rev = ins.data.rev; cloud.dirty = false; cloud.lastSync = new Date();
    if(legacy){ localStorage.setItem('classboardMigratedTo', uid); setTimeout(()=>toast('Your existing data on this device was uploaded to your account'), 400); }
    cacheWrite(); setSync('synced'); return;
  }
  if(cache && cache.dirty){                       // unsynced edits from last time — push them (conflict dialog if cloud moved on)
    state = normalizeState(cache.state); cloud.rev = cache.rev || 0; cloud.dirty = true; cloud.seq++;
    setSync('saving'); setTimeout(()=>cloudPush(), 300); return;
  }
  state = normalizeState(row.data); cloud.rev = row.rev; cloud.dirty = false; cloud.lastSync = new Date();
  cacheWrite(); setSync('synced');
}

function setupSyncListeners(){
  if(listenersReady) return; listenersReady = true;
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') cloudPull();
    else if(cloud.dirty){ clearTimeout(cloud.timer); cloudPush(); }
  });
  window.addEventListener('online', ()=>{ if(cloud.dirty) cloudPush(); else cloudPull(); });
  window.addEventListener('offline', ()=>setSync('offline'));
  window.addEventListener('beforeunload', e=>{ if(cloud.dirty && cloud.user){ e.preventDefault(); e.returnValue = ''; } });
}

/* ---- session / app entry ---- */
function initSupabase(){
  if(sb) return 'ok';
  const cfg = sbConfig();
  if(!cfg) return 'config';
  if(!window.supabase || !window.supabase.createClient) return 'lib';
  sb = window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((event, session)=>{ setTimeout(()=>onAuthEvent(event, session), 0); });
  return 'ok';
}
function hashError(){
  const h = location.hash.replace(/^#/,''); if(!h) return '';
  try{ return new URLSearchParams(h).get('error_description') || ''; }catch(e){ return ''; }
}
function cleanUrl(){ if(location.hash || /[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname); }

async function bootApp(){
  setMode('boot');
  const st = initSupabase();
  if(st!=='ok'){ authView = st; setMode('auth'); renderAuth(); return; }
  const he = hashError();
  if(he){ authFlash = {type:'error', text:he}; cleanUrl(); }
  try{
    const {data} = await sb.auth.getSession();
    if(recoveryMode && data.session){ authView = 'recovery'; setMode('auth'); renderAuth(); return; }
    if(data.session) await enterApp(data.session);
    else { authView = 'signin'; setMode('auth'); renderAuth(); }
  }catch(e){
    authView = 'signin'; setMode('auth'); renderAuth();
    authMsg('error', friendlyAuthError(e));
  }
}

async function enterApp(session, force){
  if(entering) return;
  if(appReady && cloud.user && cloud.user.id===session.user.id){
    cloud.user = session.user;
    if(force || document.body.className!=='mode-app'){ setMode('app'); render(); }
    return;
  }
  entering = true;
  try{
    cloud.user = session.user; cloud.conflict = false;
    setMode('boot');
    await cloudLoadInitial();
    appReady = true;
    cleanUrl();
    setMode('app'); render(); setupSyncListeners();
  }catch(e){
    console.error('Load failed', e);
    cloud.user = null; appReady = false;
    authView = 'loaderror'; authFlash = {type:'error', text:friendlyDbError(e)};
    setMode('auth'); renderAuth();
  }finally{ entering = false; }
}

function onAuthEvent(event, session){
  if(event==='PASSWORD_RECOVERY'){ recoveryMode = true; authView = 'recovery'; setMode('auth'); renderAuth(); return; }
  if(event==='SIGNED_IN' && session && !recoveryMode){ enterApp(session); return; }
  if(event==='SIGNED_OUT'){ if(appReady || cloud.user) handleSignedOut(); return; }
  if(event==='TOKEN_REFRESHED' && session && cloud.user) cloud.user = session.user;
}
function handleSignedOut(){
  clearTimeout(cloud.timer);
  appReady = false; cloud.user = null; cloud.dirty = false; cloud.rev = 0; cloud.conflict = false; cloud.pushing = false; cloud.latest = null;
  state = defaultData(); dutyStopTimer(); closeModal(); closeClock();
  authView = 'signin'; setMode('auth'); renderAuth();
}
async function signOut(){
  if(cloud.dirty){
    clearTimeout(cloud.timer); await cloudPush();
    if(cloud.dirty && !confirm('Some recent changes haven\u2019t reached the cloud yet. Sign out anyway and lose them?')) return;
  }
  const uid = cloud.user && cloud.user.id;
  try{ await sb.auth.signOut(); }catch(e){}
  if(uid) localStorage.removeItem(cacheKey(uid));      // don't leave data behind on shared devices
  handleSignedOut();
}

/* ---- auth screen ---- */
function authMsg(type, text){
  const m = document.getElementById('authMsg'); if(!m) return;
  m.className = 'auth-msg' + (text ? ' '+type : ''); m.textContent = text || '';
}
function authGo(view){
  const e = document.getElementById('aEmail'); if(e) authEmail = e.value.trim();
  authView = view; authFlash = null; renderAuth();
}
function authTogglePw(id, btn){
  const i = document.getElementById(id); if(!i) return;
  const show = i.type==='password'; i.type = show ? 'text' : 'password'; btn.textContent = show ? 'Hide' : 'Show';
}
function pwField(id, label, ac){
  return `<div class="field"><label for="${id}">${label}</label><div class="pw-wrap"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="pw-toggle" onclick="authTogglePw('${id}',this)">Show</button></div></div>`;
}
function renderAuth(){
  const el = document.getElementById('authScreen');
  const emailField = `<div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="${esc(authEmail)}"></div>`;

    ? `<div class="auth-tabs"><button type="button" class="auth-tab ${authView==='signin'?'active':''}" onclick="authGo('signin')">Sign in</button><button type="button" class="auth-tab ${authView==='signup'?'active':''}" onclick="authGo('signup')">Create account</button></div>` : '';
  let sub = 'Teacher\u2019s Portal', body = '';
  if(authView==='signin'){
    body = `<form onsubmit="return authSubmit(event)" novalidate>${emailField}${pwField('aPass','Password','current-password')}
      <button class="btn btn-primary auth-submit" type="submit">Sign in</button>
      <div class="auth-links"><button type="button" class="auth-link" onclick="authGo('forgot')">Forgot password?</button></div></form>`;
  } else if(authView==='signup'){
    body = `<form onsubmit="return authSubmit(event)" novalidate>${emailField}${pwField('aPass','Password (at least 8 characters)','new-password')}${pwField('aPass2','Confirm password','new-password')}
      <button class="btn btn-primary auth-submit" type="submit">Create account</button></form>`;
  } else if(authView==='forgot'){
    sub = 'Reset your password';
    body = `<form onsubmit="return authSubmit(event)" novalidate><div class="hint" style="margin:0 0 12px;">Enter your account email and we\u2019ll send you a link to choose a new password.</div>${emailField}
      <button class="btn btn-primary auth-submit" type="submit">Send reset link</button>
      <div class="auth-links"><button type="button" class="auth-link" onclick="authGo('signin')">\u2190 Back to sign in</button></div></form>`;
  } else if(authView==='recovery'){
    sub = 'Choose a new password';
    body = `<form onsubmit="return authSubmit(event)" novalidate>${pwField('aPass','New password (at least 8 characters)','new-password')}${pwField('aPass2','Confirm new password','new-password')}
      <button class="btn btn-primary auth-submit" type="submit">Update password</button></form>`;
  } else if(authView==='confirm'){
    sub = 'Confirm your email';
    body = `<button class="btn btn-ghost auth-submit" type="button" onclick="authResend()">Resend confirmation email</button>
      <div class="auth-links"><button type="button" class="auth-link" onclick="authGo('signin')">\u2190 Back to sign in</button></div>`;
  } else if(authView==='config'){
    sub = 'Connect your Supabase project';
    body = `<form onsubmit="return authSubmit(event)" novalidate>
      <div class="field"><label for="aUrl">Project URL</label><input id="aUrl" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off"></div>
      <div class="field"><label for="aKey">Anon / publishable key</label><input id="aKey" placeholder="eyJ... or sb_publishable_..." autocomplete="off"></div>
      <button class="btn btn-primary auth-submit" type="submit">Save &amp; continue</button>
      <div class="hint">Find both in Supabase \u2192 Project Settings \u2192 API. You can also paste them into <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> at the top of this file\u2019s script.</div></form>`;
  } else if(authView==='lib'){
    sub = 'Couldn\u2019t load';
    body = `<div class="hint" style="font-size:13px; color:var(--chalk-dim); margin:0 0 14px;">The sign-in library didn\u2019t load. Check your internet connection and try again.</div>
      <button class="btn btn-primary auth-submit" type="button" onclick="location.reload()">Reload</button>`;
  } else if(authView==='loaderror'){
    sub = 'Couldn\u2019t load your data';
    body = `<button class="btn btn-primary auth-submit" type="button" onclick="bootApp()">Try again</button>
      <div class="auth-links"><button type="button" class="auth-link" onclick="authSignOutOnly()">Sign out</button></div>`;
  }
  el.innerHTML = `<div class="auth-card"><div class="auth-logo"></div><h1 class="auth-title">ClassBoard</h1><p class="auth-sub">${sub}</p>${tabs}<div id="authMsg" class="auth-msg"></div>${body}</div>`;
  if(authFlash){ authMsg(authFlash.type, authFlash.text); authFlash = null; }
  const first = el.querySelector('input');
  if(first && !/Mobi|Android/i.test(navigator.userAgent)) first.focus();
}
function setAuthBusy(b){
  const btn = document.querySelector('.auth-submit'); if(!btn) return;
  btn.disabled = b;
  if(b){ btn.dataset.label = btn.textContent; btn.textContent = 'Please wait\u2026'; }
  else if(btn.dataset.label){ btn.textContent = btn.dataset.label; }
}
async function authSubmit(ev){
  ev.preventDefault();
  if(authBusy) return false;
  const v = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const email = v('aEmail').trim();
  if(document.getElementById('aEmail')) authEmail = email;
  authBusy = true; setAuthBusy(true); authMsg('', '');
  try{
    if(authView==='signin') await doSignIn(email, v('aPass'));
    else if(authView==='signup') await doSignUp(email, v('aPass'), v('aPass2'));
    else if(authView==='forgot') await doForgot(email);
    else if(authView==='recovery') await doRecovery(v('aPass'), v('aPass2'));
    else if(authView==='config') doSaveConfig(v('aUrl').trim(), v('aKey').trim());
  }catch(e){ authMsg('error', friendlyAuthError(e)); }
  finally{ authBusy = false; setAuthBusy(false); }
  return false;
}
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
async function doSignIn(email, pass){
  if(!validEmail(email)){ authMsg('error', 'Enter a valid email address.'); return; }
  if(!pass){ authMsg('error', 'Enter your password.'); return; }
  const {data, error} = await sb.auth.signInWithPassword({email, password:pass});
  if(error){
    if(/not confirmed/i.test(error.message)){
      authView = 'confirm'; authFlash = {type:'info', text:'Your email isn\u2019t confirmed yet. Open the confirmation link we emailed you, or resend it below.'}; renderAuth(); return;
    }
    throw error;
  }
  if(data.session) enterApp(data.session);
}
async function doSignUp(email, pass, pass2){
  if(!validEmail(email)){ authMsg('error', 'Enter a valid email address.'); return; }
  if(pass.length < 8){ authMsg('error', 'Use a password with at least 8 characters.'); return; }
  if(pass !== pass2){ authMsg('error', 'The two passwords don\u2019t match.'); return; }
  const {data, error} = await sb.auth.signUp({email, password:pass, options:{emailRedirectTo:redirectUrl()}});
  if(error) throw error;
  if(data.session){ enterApp(data.session); return; }                           // email confirmation turned off
  if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
    authView = 'signin'; authFlash = {type:'error', text:'This email is already registered. Sign in, or use \u201cForgot password?\u201d.'}; renderAuth(); return;
  }
  authView = 'confirm'; authFlash = {type:'success', text:'We sent a confirmation link to '+email+'. Open it, then come back and sign in.'}; renderAuth();
}
async function doForgot(email){
  if(!validEmail(email)){ authMsg('error', 'Enter the email address of your account.'); return; }
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo:redirectUrl()});
  if(error) throw error;
  authView = 'signin'; authFlash = {type:'success', text:'If an account exists for '+email+', a password reset link is on its way. Check your inbox (and spam folder).'}; renderAuth();
}
async function doRecovery(pass, pass2){
  if(pass.length < 8){ authMsg('error', 'Use a password with at least 8 characters.'); return; }
  if(pass !== pass2){ authMsg('error', 'The two passwords don\u2019t match.'); return; }
  const {error} = await sb.auth.updateUser({password:pass});
  if(error) throw error;
  recoveryMode = false; cleanUrl();
  const {data} = await sb.auth.getSession();
  if(data.session){ toast('Password updated'); await enterApp(data.session, true); }
  else { authView = 'signin'; authFlash = {type:'success', text:'Password updated. Please sign in.'}; renderAuth(); }
}
async function authResend(){
  if(!authEmail || !validEmail(authEmail)){ authGo('signin'); authMsg('error', 'Enter your email, then try signing in again to get a new link.'); return; }
  try{
    const {error} = await sb.auth.resend({type:'signup', email:authEmail, options:{emailRedirectTo:redirectUrl()}});
    if(error) throw error;
    authMsg('success', 'Confirmation email sent to '+authEmail+'.');
  }catch(e){ authMsg('error', friendlyAuthError(e)); }
}
function doSaveConfig(url, key){
  if(!/^https:\/\/.+/.test(url)){ authMsg('error', 'Enter the full project URL, starting with https://'); return; }
  if(key.length < 20){ authMsg('error', 'Paste the anon / publishable key.'); return; }
  localStorage.setItem(CFG_KEY, JSON.stringify({url:url.replace(/\/+$/,''), key}));
  location.reload();
}
async function authSignOutOnly(){ try{ if(sb) await sb.auth.signOut(); }catch(e){} authView = 'signin'; renderAuth(); }

function openDeleteAccount(){

  openModal(`

    </p>
    <div class="field"><label>Type <b>DELETE</b> to confirm</label><input id="delConfirm" autocomplete="off" placeholder="DELETE"></div>
    <div class="modal-actions">

      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>

    </div>`);

async function confirmDeleteAccount(){
  const v = (document.getElementById('delConfirm').value || '').trim();
  if(v !== 'DELETE'){ toast('Type DELETE to confirm'); return; }
  const btn = document.getElementById('delBtn'); btn.disabled = true; btn.textContent = 'Deleting\u2026';

    clearTimeout(cloud.timer);
    const {error} = await sb.rpc('delete_my_account');
    if(error) throw error;
    const uid = cloud.user && cloud.user.id;
    cloud.dirty = false;                                   // nothing left to upload
    if(uid){ localStorage.removeItem(cacheKey(uid)); localStorage.removeItem('classboardMigratedTo'); }
    try{ await sb.auth.signOut({scope:'local'}); }catch(e){}
    authFlash = {type:'success', text:'Your account and all its data were deleted.'};
    handleSignedOut();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Delete forever';
    const m = String((e && e.message) || '');
    if(e && (e.code==='PGRST202' || /could not find the function|delete_my_account/i.test(m))) toast('Run the updated supabase_setup.sql first, then try again');
    else toast(friendlyDbError(e));
  }
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fname = (state.semester.name || 'classboard').replace(/[^a-zA-Z0-9_-]/g,'_');
  a.href = url; a.download = `classboard_${fname}_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('JSON file downloaded');
}
function isLegacyDutyFile(d){
  if(!d || typeof d!=='object' || Array.isArray(d) || d.courses) return false;
  if(d.settings && Array.isArray(d.settings.weekend) && d.data && typeof d.data==='object') return true;
  const keys = Object.keys(d);
  return keys.length>0 && keys.every(k=>/^\d{4}-\d{2}-\d{2}$/.test(k));
}
function importJSON(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(isLegacyDutyFile(data)){ dutyImportParsed(data); return; }
      if(!data || !data.courses || !data.tasks) throw new Error('invalid');
      if(!confirm('All current data will be replaced. Continue?')) return;
      const next = normalizeState(data);
      if(!data.duty) next.duty = state.duty;          // older backups have no Duty Log section — keep current entries
      state = next;
      attendanceFilterCourse = null; attendanceDraftKey = '';
      save(); toast('Data imported successfully'); render();
    }catch(err){ toast('This file is not valid'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}
function clearAllData(){
  if(!confirm('Are you sure you want to delete all data? This cannot be undone.')) return;
  if(!confirm('Final confirmation \u2014 all semesters, courses, routine, tasks, students, attendance, reminders and Duty Log entries will be deleted from your account.')) return;
  state = defaultData(); attendanceFilterCourse = null; attendanceDraftKey = ''; save(); toast('All data deleted'); render();
}

/* ======================================================================
   DUTY LOG  (merged from the standalone Duty Log app)
   ====================================================================== */
const DUTY_WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DUTY_WD_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DUTY_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let dutyViewYear = new Date().getFullYear(), dutyViewMonth = new Date().getMonth();
let dutyTimerInt = null;
let dutyModalState = {date:null, mode:'work', offType:'leave'};
let dutySettingsDraft = [];
let dutyPending = null;

function dEntries(){ return state.duty.entries; }
function dSettings(){ return state.duty.settings; }
function dKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function dTodayKey(){ return isoLocal(new Date()); }
function dMin(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; }
function dHM(totalMin){ const a = Math.abs(totalMin); return Math.floor(a/60)+'h '+String(a%60).padStart(2,'0')+'m'; }
function dDur(entry, exit){
  const a = dMin(entry), b = dMin(exit);
  if(a==null || b==null) return null;
  let diff = b - a; if(diff < 0) diff += 1440;           // overnight shift fallback
  return {hours:Math.floor(diff/60), minutes:diff%60, total:diff, label:dHM(diff)};
}
function dIsWeekend(dObj){ return dSettings().weekend.includes(dObj.getDay()); }
// "leave" = your own leave (still an expected duty day). "holiday" = office closed (no duty expected).
// Entries saved without an offType are treated as 'holiday'.
function dOffType(e){ return (e && e.type==='off' && e.offType) ? e.offType : 'holiday'; }
function dDayStatus(y,m,d){
  const key = dKey(y,m,d), dObj = new Date(y,m,d), entry = dEntries()[key];
  const isToday = key === dTodayKey();
  const isFuture = dObj > new Date(new Date().setHours(0,0,0,0));
  if(entry && entry.type==='work'){
    if(entry.exit) return {status:'worked', key, entry};
    return {status: isToday ? 'in-progress' : 'incomplete', key, entry};
  }
  if(entry && entry.type==='off') return {status:'off', key, entry};
  if(isFuture) return {status:'future', key, entry:null};
  if(dIsWeekend(dObj)) return {status:'weekend', key, entry:null};
  if(isToday) return {status:'today-pending', key, entry:null};
  return {status:'missed', key, entry:null};
}
function dFlags(entry){
  const f = {late:false, early:false};
  if(!entry || entry.type!=='work') return f;
  const st = dMin(dSettings().dutyStart), en = dMin(dSettings().dutyEnd), a = dMin(entry.entry);
  if(a!=null && st!=null && a > st) f.late = true;
  if(entry.exit){ const x = dMin(entry.exit); if(x!=null && en!=null && x < en) f.early = true; }
  return f;
}
function dDailyMin(){
  const s = dMin(dSettings().dutyStart), e = dMin(dSettings().dutyEnd);
  if(s==null || e==null) return 0;
  let diff = e - s; if(diff < 0) diff += 1440;
  return diff;
}
function dMonthSummary(y,m){
  const dim = new Date(y,m+1,0).getDate(), daily = dDailyMin();
  let present=0, missed=0, leave=0, holiday=0, weekend=0, worked=0, late=0, early=0, expDays=0, expMin=0;
  for(let d=1; d<=dim; d++){
    const info = dDayStatus(y,m,d), wknd = dIsWeekend(new Date(y,m,d));
    if(info.status==='future') continue;
    if(info.status==='off'){
      if(dOffType(info.entry)==='holiday') holiday++;
      else { leave++; if(!wknd){ expDays++; expMin += daily; } }
      continue;
    }
    if(info.status==='weekend'){ weekend++; continue; }
    expDays++; expMin += daily;
    if(info.status==='worked'){
      present++;
      const du = dDur(info.entry.entry, info.entry.exit); if(du) worked += du.total;
      const fl = dFlags(info.entry); if(fl.late) late++; if(fl.early) early++;
    } else if(info.status==='in-progress' || info.status==='incomplete'){
      present++; if(dFlags(info.entry).late) late++;
    } else if(info.status==='missed'){ missed++; }
  }
  return {present, missed, leave, holiday, weekend, worked, late, early, expDays, expMin, daily};
}

/* ---- timer ---- */
function dutyStopTimer(){ if(dutyTimerInt){ clearInterval(dutyTimerInt); dutyTimerInt = null; } }
function dFmtHMS(sec){
  const a = Math.max(0, Math.floor(sec)), p = n=>String(n).padStart(2,'0');
  return p(Math.floor(a/3600))+':'+p(Math.floor((a%3600)/60))+':'+p(a%60);
}
function dutyUpdateTimer(entryT){
  const valEl = document.getElementById('dutyTimerVal'), lblEl = document.getElementById('dutyTimerLbl');
  if(!valEl){ dutyStopTimer(); return; }
  const endT = dSettings().dutyEnd;
  if(!endT || !entryT){ valEl.textContent = '\u2014'; return; }
  const [eh,em] = entryT.split(':').map(Number), [xh,xm] = endT.split(':').map(Number), now = new Date();
  const entryDt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eh, em, 0, 0);
  let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), xh, xm, 0, 0);
  if(target <= entryDt) target = new Date(target.getTime() + 86400000);   // overnight duty
  const remain = target - now;
  if(remain > 0){ lblEl.textContent = 'Time left in duty'; valEl.textContent = dFmtHMS(remain/1000); valEl.style.color = 'var(--yellow)'; }
  else { lblEl.textContent = 'Duty time over \u00b7 overtime running'; valEl.textContent = dFmtHMS(-remain/1000); valEl.style.color = 'var(--danger)'; }
}
function dutyAfterRender(){
  const e = dEntries()[dTodayKey()];
  dutyStopTimer();
  if(e && e.type==='work' && !e.exit){ dutyUpdateTimer(e.entry); dutyTimerInt = setInterval(()=>dutyUpdateTimer(e.entry), 1000); }
}

/* ---- main view ---- */
function dutyTodayHtml(){
  const key = dTodayKey(), e = dEntries()[key];
  const dateStr = new Date().toLocaleDateString('en-US',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const head = `<p class="card-title">Today</p><div class="hint" style="margin:-6px 0 10px;">${dateStr}</div>`;
  const openBtn = (label, primary)=>`<button class="btn ${primary?'btn-primary':''}" style="margin-top:12px; width:100%;" onclick="dutyOpenDay('${key}')">${label}</button>`;
  if(e && e.type==='work' && e.exit){
    const du = dDur(e.entry, e.exit), fl = dFlags(e);
    const note = [fl.late ? 'Arrived late'+(e.lateReason?' \u2014 '+esc(e.lateReason):'') : '', fl.early ? 'Left early'+(e.earlyReason?' \u2014 '+esc(e.earlyReason):'') : ''].filter(Boolean).join(' \u00b7 ');
    return `${head}
      <div style="display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;"><div class="duty-today-big">${du?du.label:'\u2014'}</div><div class="hint" style="margin:0;">on duty today</div></div>
      <div class="mono" style="font-size:12.5px; color:var(--chalk-dim); margin-top:6px;">${formatTime12(e.entry)} \u2192 ${formatTime12(e.exit)}</div>
      ${note?`<div class="duty-note">${note}</div>`:''}${openBtn('Edit entry')}`;
  }
  if(e && e.type==='work'){
    const fl = dFlags(e);
    return `${head}
      <div class="duty-status-line" style="color:var(--yellow);">Currently on duty</div>
      <div class="mono" style="font-size:12.5px; color:var(--chalk-dim); margin-top:6px;">Entry: ${formatTime12(e.entry)}</div>
      ${fl.late?`<div class="duty-note">Arrived late${e.lateReason?' \u2014 '+esc(e.lateReason):''}</div>`:''}
      <div class="duty-timer"><div class="duty-timer-lbl" id="dutyTimerLbl">Time left in duty</div><div class="duty-timer-val" id="dutyTimerVal">--:--:--</div></div>
      ${openBtn('Add exit time', true)}`;
  }
  if(e && e.type==='off'){
    const holiday = dOffType(e)==='holiday';
    return `${head}<div class="duty-status-line" style="color:${holiday?'var(--purple)':'var(--amber)'};">${holiday?'Office closed today':'Personal leave today'}${e.label?' \u2014 '+esc(e.label):''}</div>${openBtn('Edit entry')}`;
  }
  return `${head}<div class="duty-status-line">Today\u2019s entry hasn\u2019t been added yet</div>${openBtn('Add entry', true)}`;
}
function dutyCalendarHtml(){
  const y = dutyViewYear, m = dutyViewMonth, dim = new Date(y,m+1,0).getDate(), first = new Date(y,m,1).getDay();
  const wd = DUTY_WD.map((w,i)=>`<span class="${dSettings().weekend.includes(i)?'wk':''}">${w}</span>`).join('');
  let cells = '';
  for(let i=0;i<first;i++) cells += '<div class="dcell empty"></div>';
  for(let d=1; d<=dim; d++){
    const info = dDayStatus(y,m,d), e = info.entry;
    let cls = info.status, sub = '', flag = '', pend = '', tip = [];
    if(info.status==='worked'){
      const du = dDur(e.entry, e.exit); sub = du ? du.hours+'h'+String(du.minutes).padStart(2,'0')+'m' : '';
      const fl = dFlags(e);
      if(fl.late){ flag = '<span class="flag"></span>'; tip.push('Late'+(e.lateReason?': '+e.lateReason:'')); }
      if(fl.early){ flag = '<span class="flag"></span>'; tip.push('Left early'+(e.earlyReason?': '+e.earlyReason:'')); }
    } else if(info.status==='in-progress' || info.status==='incomplete'){
      cls = 'progress'; sub = info.status==='in-progress' ? 'On duty' : 'No exit';
      if(dFlags(e).late){ flag = '<span class="flag"></span>'; tip.push('Late'+(e.lateReason?': '+e.lateReason:'')); }
    } else if(info.status==='off'){
      const ot = dOffType(e); cls = 'off type-'+ot; sub = ot==='holiday' ? 'Closed' : 'Leave';
      if(e.label) tip.push(e.label);
    } else if(info.status==='today-pending'){ cls = 'pending'; pend = '<span class="pend"></span>'; }
    if(info.key===dTodayKey()) cls += ' is-today';
    cells += `<button type="button" class="dcell ${cls}" onclick="dutyOpenDay('${info.key}')"${tip.length?` title="${esc(tip.join(' \u00b7 '))}"`:''}><span class="dnum">${d}</span>${sub?`<span class="dsub">${sub}</span>`:''}${pend}${flag}</button>`;
  }
  const lg = (c,t)=>`<span><i style="background:${c};"></i>${t}</span>`;
  return `
    <div class="duty-cal-head">
      <button class="btn btn-ghost btn-icon" onclick="dutyShiftMonth(-1)" title="Previous month"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2>${DUTY_MONTHS[m]} ${y}</h2>
      <button class="btn btn-ghost btn-icon" onclick="dutyShiftMonth(1)" title="Next month"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="duty-wd">${wd}</div>
    <div class="duty-days">${cells}</div>
    <div class="duty-legend">
      ${lg('var(--green)','Duty done')}${lg('var(--yellow)','On duty / no exit')}${lg('var(--danger)','Absent')}${lg('var(--amber)','Personal leave')}${lg('var(--purple)','Office closed')}${lg('var(--chalk-faint)','Weekly holiday')}${lg('var(--amber)','Late / left early (dot)')}
    </div>`;
}
function renderDuty(){
  const y = dutyViewYear, m = dutyViewMonth, s = dMonthSummary(y,m);
  const stat = (n,l,c)=>`<div class="duty-stat"><div class="duty-stat-num" style="color:${c};">${n}</div><div class="duty-stat-lbl">${l}</div></div>`;
  const diff = s.worked - s.expMin;
  const isCurrent = (y===new Date().getFullYear() && m===new Date().getMonth());
  return `
    <div class="topbar">
      <div><h1>Duty Log</h1><div class="sub">Office attendance and duty hours</div></div>
      <div class="topbar-actions"><button class="btn btn-ghost" onclick="dutyExportPDF()">${ICONS.pdf} ${DUTY_MONTHS[m]} PDF</button><button class="btn btn-ghost" onclick="dutyOpenSettings()">${ICONS.setup.replace('<svg','<svg width="15" height="15"')} Duty settings</button></div>
    </div>
    <div class="duty-layout">
      <div class="card d-today">${dutyTodayHtml()}</div>
      <div class="card d-sum">
        <p class="card-title">${DUTY_MONTHS[m]} summary</p>
        <div class="duty-stats">
          ${stat(s.present,'Present','var(--green)')}${stat(s.missed,'Absent','var(--danger)')}${stat(s.leave,'Personal leave','var(--amber)')}${stat(s.holiday,'Office closed','var(--purple)')}
          ${stat(dHM(s.worked),'Hours worked','var(--yellow)')}${stat(dHM(s.expMin),'Expected hours','var(--chalk-dim)')}${stat(s.late,'Late','var(--amber)')}${stat(s.early,'Left early','var(--amber)')}
        </div>
        <div class="duty-diff"><span>Expected duty days: <b>${s.expDays}</b></span><span>Actual \u2212 expected: <b style="color:${diff<0?'var(--danger)':'var(--green)'};">${diff<0?'\u2212':'+'}${dHM(diff)}</b></span></div>
        <div class="hint">Office-closed days are left out of expected hours. Personal-leave days still count as expected duty days.</div>
      </div>
      <div class="card d-cal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px;">
          <p class="card-title" style="margin:0;">Calendar</p>
          ${isCurrent?'':`<button class="btn btn-ghost btn-sm" onclick="dutyGoToday()">This month</button>`}
        </div>
        ${dutyCalendarHtml()}
      </div>
    </div>`;
}
function dutyShiftMonth(delta){
  dutyViewMonth += delta;
  if(dutyViewMonth < 0){ dutyViewMonth = 11; dutyViewYear--; }
  if(dutyViewMonth > 11){ dutyViewMonth = 0; dutyViewYear++; }
  render();
}
function dutyGoToday(){ const n = new Date(); dutyViewYear = n.getFullYear(); dutyViewMonth = n.getMonth(); render(); }

/* ---- day entry modal ---- */
function dutyOpenDay(key){
  const e = dEntries()[key], [y,m,d] = key.split('-').map(Number), dObj = new Date(y,m-1,d);
  const mode = (e && e.type==='off') ? 'off' : 'work';
  dutyModalState = {date:key, mode, offType:(e && e.type==='off') ? dOffType(e) : 'leave'};
  const st = dSettings(), w = (e && e.type==='work') ? e : {};
  openModal(`
    <h3>Day entry</h3>
    <div class="hint" style="margin:-8px 0 14px;">${DUTY_WD_FULL[dObj.getDay()]}, ${d} ${DUTY_MONTHS[m-1]} ${y}</div>
    <div class="chips" style="margin-bottom:14px;">
      <span class="chip ${mode==='work'?'active':''}" data-dmode="work" onclick="dutySetMode('work')">Duty time</span>
      <span class="chip ${mode==='off'?'active':''}" data-dmode="off" onclick="dutySetMode('off')">Leave / closed</span>
    </div>
    <div id="dWork" style="${mode==='work'?'':'display:none;'}">
      <div class="row">
        <div class="field"><label>Entry time</label>${timeInputHtml('dEntry', w.entry, st.dutyStart)}</div>
        <div class="field"><label>Exit time (optional)</label>
          <div class="duty-exit-row">${timeInputHtml('dExit', w.exit, st.dutyEnd)}<button type="button" class="btn btn-ghost btn-icon" title="Clear exit time" onclick="dutyClearExit()">${ICONS.xmark}</button></div>
        </div>
      </div>
      <div class="hint" id="dDurHint" style="margin:0 0 12px;"></div>
      <div class="field" id="dLateField" style="display:none;"><label>Reason for being late (optional)</label><input id="dLateReason" value="${esc(w.lateReason||'')}" placeholder="e.g. Heavy traffic"></div>
      <div class="field" id="dEarlyField" style="display:none;"><label>Reason for leaving early (optional)</label><input id="dEarlyReason" value="${esc(w.earlyReason||'')}" placeholder="e.g. Doctor's appointment"></div>
    </div>
    <div id="dOff" style="${mode==='off'?'':'display:none;'}">
      <div class="field"><label>Type</label>
        <div class="chips" style="margin-bottom:6px;">
          <span class="chip ${dutyModalState.offType==='leave'?'active':''}" data-doff="leave" onclick="dutySetOff('leave')">Personal leave</span>
          <span class="chip ${dutyModalState.offType==='holiday'?'active':''}" data-doff="holiday" onclick="dutySetOff('holiday')">Office closed / holiday</span>
        </div>
        <div class="hint" style="margin:0;">Personal leave still counts toward your expected duty hours (you were supposed to work). On office-closed days no duty hours are expected at all.</div>
      </div>
      <div class="field"><label>Reason / name (optional)</label><input id="dOffLabel" value="${esc(e && e.type==='off' ? (e.label||'') : '')}" placeholder="e.g. Eid holiday, sick leave"></div>
    </div>
    <div class="modal-actions">
      ${e?`<button class="btn btn-danger" style="margin-right:auto;" onclick="dutyClearDay()">Clear entry</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="dutySaveDay()">Save</button>
    </div>`);
  ['dEntry','dExit'].forEach(id=>document.getElementById(id).addEventListener('change', dutyTimeChanged));
  dutyTimeChanged();
}
function dutySetMode(mode){
  dutyModalState.mode = mode;
  document.querySelectorAll('[data-dmode]').forEach(c=>c.classList.toggle('active', c.dataset.dmode===mode));
  document.getElementById('dWork').style.display = mode==='work' ? '' : 'none';
  document.getElementById('dOff').style.display = mode==='off' ? '' : 'none';
}
function dutySetOff(type){
  dutyModalState.offType = type;
  document.querySelectorAll('[data-doff]').forEach(c=>c.classList.toggle('active', c.dataset.doff===type));
}
function dutyClearExit(){
  const x = document.getElementById('dExit'); x.dataset.time = ''; x.value = ''; dutyTimeChanged();
}
function dutyTimeChanged(){
  const en = document.getElementById('dEntry'), ex = document.getElementById('dExit'); if(!en || !ex) return;
  const eT = en.dataset.time || '', xT = ex.dataset.time || '';
  const fl = dFlags({type:'work', entry:eT, exit:xT});
  document.getElementById('dLateField').style.display = fl.late ? 'block' : 'none';
  document.getElementById('dEarlyField').style.display = fl.early ? 'block' : 'none';
  const hint = document.getElementById('dDurHint'), du = dDur(eT, xT);
  hint.textContent = (eT && xT && du) ? 'Total time: '+du.label : eT ? 'Saving with just the entry time is fine \u2014 add the exit time later.' : 'Select an entry time.';
}
function dutySaveDay(){
  const key = dutyModalState.date; if(!key) return;
  if(dutyModalState.mode==='work'){
    const eT = document.getElementById('dEntry').dataset.time || '', xT = document.getElementById('dExit').dataset.time || '';
    if(!eT){ toast('Please select an entry time'); return; }
    const fl = dFlags({type:'work', entry:eT, exit:xT}), obj = {type:'work', entry:eT, exit:xT || null};
    if(fl.late){ const v = document.getElementById('dLateReason').value.trim(); if(v) obj.lateReason = v; }
    if(fl.early){ const v = document.getElementById('dEarlyReason').value.trim(); if(v) obj.earlyReason = v; }
    state.duty.entries[key] = obj;
  } else {
    state.duty.entries[key] = {type:'off', label:document.getElementById('dOffLabel').value.trim(), offType:dutyModalState.offType};
  }
  save(); closeModal(); toast('Entry saved'); render();
}
function dutyClearDay(){
  const key = dutyModalState.date; if(!key) return;
  delete state.duty.entries[key];
  save(); closeModal(); toast('Entry cleared'); render();
}

/* ---- settings modal ---- */
function dutyOpenSettings(){
  const st = dSettings();
  dutySettingsDraft = [...st.weekend];
  openModal(`
    <h3>Duty settings</h3>
    <div class="field"><label>Weekly holidays</label>
      <div class="chips" style="margin-bottom:6px;">${DUTY_WD.map((w,i)=>`<span class="chip ${dutySettingsDraft.includes(i)?'active':''}" data-wd="${i}" onclick="dutyToggleWeekend(${i})">${w}</span>`).join('')}</div>
      <div class="hint" style="margin:0;">On the selected days, a missing entry isn\u2019t counted as absent.</div>
    </div>
    <div class="row">
      <div class="field"><label>Duty start</label>${timeInputHtml('dsStart', st.dutyStart)}</div>
      <div class="field"><label>Duty end</label>${timeInputHtml('dsEnd', st.dutyEnd)}</div>
    </div>
    <div class="hint" style="margin-top:0;">An entry after the start time counts as late; an exit before the end time counts as leaving early. The time between start and end is your expected duty time for each working day.</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="dutySaveSettings()">Save</button></div>`);
}
function dutyToggleWeekend(i){
  const p = dutySettingsDraft.indexOf(i);
  if(p>-1) dutySettingsDraft.splice(p,1); else dutySettingsDraft.push(i);
  document.querySelectorAll('[data-wd]').forEach(c=>c.classList.toggle('active', dutySettingsDraft.includes(Number(c.dataset.wd))));
}
function dutySaveSettings(){
  const s = document.getElementById('dsStart').dataset.time, e = document.getElementById('dsEnd').dataset.time;
  if(!s || !e){ toast('Please set both start and end time'); return; }
  state.duty.settings = {weekend:[...dutySettingsDraft].sort((a,b)=>a-b), dutyStart:s, dutyEnd:e};
  save(); closeModal(); toast('Duty settings saved'); render();
}

/* ---- PDF (print dialog, same as the other ClassBoard exports) ---- */
function dutyExportPDF(){
  const y = dutyViewYear, m = dutyViewMonth, dim = new Date(y,m+1,0).getDate();
  let rows = '';
  for(let d=1; d<=dim; d++){
    const info = dDayStatus(y,m,d), e = info.entry, wd = DUTY_WD[new Date(y,m,d).getDay()], fl = dFlags(e);
    let status = '', eT = '-', xT = '-', dT = '-', fT = '-';
    if(info.status==='worked'){
      status = 'Present'; eT = formatTime12(e.entry); xT = formatTime12(e.exit);
      const du = dDur(e.entry, e.exit); if(du) dT = du.label;
      const f = [];
      if(fl.late) f.push('Late'+(e.lateReason?' ('+esc(e.lateReason)+')':''));
      if(fl.early) f.push('Left early'+(e.earlyReason?' ('+esc(e.earlyReason)+')':''));
      fT = f.length ? f.join(', ') : '-';
    } else if(info.status==='in-progress' || info.status==='incomplete'){
      status = info.status==='in-progress' ? 'Present (ongoing)' : 'Present (no exit logged)'; eT = formatTime12(e.entry);
      if(fl.late) fT = 'Late'+(e.lateReason?' ('+esc(e.lateReason)+')':'');
    } else if(info.status==='missed'){ status = 'Absent'; }
    else if(info.status==='off'){ status = (dOffType(e)==='holiday' ? 'Office closed / holiday' : 'Personal leave') + (e.label?' \u2014 '+esc(e.label):''); }
    else if(info.status==='weekend'){ status = 'Weekly holiday'; }
    else if(info.status==='today-pending'){ status = 'Pending'; }
    else { status = '-'; }
    rows += `<tr><td>${d} (${wd})</td><td>${status}</td><td>${eT}</td><td>${xT}</td><td>${dT}</td><td>${fT}</td></tr>`;
  }
  const s = dMonthSummary(y,m), diff = s.worked - s.expMin, p = state.profile;
  const html = `
    <h1>Duty Log \u2014 ${DUTY_MONTHS[m]} ${y}</h1>
    ${p.name?`<p><b>${esc(p.name)}</b>${p.department?' \u00b7 '+esc(p.department):''}${p.university?' \u00b7 '+esc(p.university):''}</p>`:''}
    <p>Exported: ${new Date().toLocaleString('en-US')}</p>
    <table><tr><th>Date</th><th>Status</th><th>Entry</th><th>Exit</th><th>Duration</th><th>Flags</th></tr>${rows}</table>
    <h2>Summary</h2>
    <p>Present: ${s.present} &nbsp; Absent: ${s.missed} &nbsp; Personal leave: ${s.leave} &nbsp; Office closed: ${s.holiday} &nbsp; Weekly holidays: ${s.weekend}</p>
    <p>Late: ${s.late} &nbsp; Left early: ${s.early}</p>
    <p><b>Expected duty days (working days, excluding office-closed days): ${s.expDays}</b><br>
    <b>Expected duty hours: ${dHM(s.expMin)}</b><br>
    <b>Actual duty hours worked: ${dHM(s.worked)}</b><br>
    <b>Difference (actual \u2212 expected): ${diff<0?'\u2212':'+'}${dHM(diff)}</b></p>
    <p style="font-size:11px;">Note: office-closed days are excluded from expected duty hours entirely. Personal-leave days still count toward expected duty hours (days you were supposed to work).</p>`;
  document.getElementById('printArea').innerHTML = html;
  setTimeout(()=>window.print(), 100);
}

/* ---- Old standalone Duty Log backup files are recognised by the main Import button ---- */
function dutyImportParsed(parsed){
  if(!parsed || typeof parsed!=='object'){ toast('This file is not valid'); return; }
  const raw = parsed.data || (parsed.duty && parsed.duty.entries) || parsed;
  const settings = parsed.settings || (parsed.duty && parsed.duty.settings) || null;
  const clean = {};
  if(raw && typeof raw==='object') Object.keys(raw).forEach(k=>{ const v = raw[k]; if(/^\d{4}-\d{2}-\d{2}$/.test(k) && v && (v.type==='work' || v.type==='off')) clean[k] = v; });
  const hasSettings = !!(settings && Array.isArray(settings.weekend));
  const n = Object.keys(clean).length;
  if(!n && !hasSettings){ toast('No duty entries found in this file'); return; }
  dutyPending = {entries:clean, settings:hasSettings ? settings : null};
  openModal(`
    <h3>Import duty data</h3>
    <p style="font-size:13.5px; line-height:1.55; color:var(--chalk-dim); margin:0;">Found <b style="color:var(--chalk);">${n}</b> duty ${n===1?'entry':'entries'}${hasSettings?' and your duty settings':''}.</p>
    <div class="hint">Merge keeps your current entries and adds the imported ones (the imported entry wins if both have the same date). Replace deletes the current Duty Log entries first.</div>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="dutyApplyImport('replace')">Replace</button>
      <button class="btn btn-primary" onclick="dutyApplyImport('merge')">Merge</button>
    </div>`);
}
function dutyApplyImport(mode){
  const p = dutyPending; if(!p) return;
  state.duty.entries = mode==='merge' ? Object.assign({}, state.duty.entries, p.entries) : p.entries;
  if(p.settings) state.duty.settings = normalizeState({duty:{settings:p.settings}}).duty.settings;
  dutyPending = null;
  save(); closeModal(); toast('Duty data imported'); render();
}

/* ---------------- Init ---------------- */
bootApp();
</script>
